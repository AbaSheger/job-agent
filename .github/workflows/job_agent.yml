name: Job Agent

on:
  schedule:
    - cron: '30 6 * * *'  # 07:30 Stockholm time (UTC+1); adjust to 05:30 UTC in summer (UTC+2)
  workflow_dispatch:        # lets you trigger it manually from GitHub

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore agent state
        uses: actions/cache@v4
        with:
          path: .agent_state
          key: job-agent-state-${{ github.run_id }}
          restore-keys: |
            job-agent-state-

      - name: Install dependencies
        run: pip install -r requirements.txt python-jobspy

      - name: Run job agent
        env:
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          JOB_AGENT_STATE_DIR: .agent_state
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python job_agent.py
